<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATR Tracker</title>
    <meta name="description" content="Athletic training room check-in. Two confirms and it counts." />
    <meta name="theme-color" content="#500000" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --maroon: #500000;
        --white: #ffffff;
        --muted: #6b6b6b;
        --wash: #f4ecec;
        --border: rgb(80 0 0 / 0.18);
        --sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        --display: "Oswald", "Arial Narrow", ui-sans-serif, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100dvh; background: var(--white); color: var(--maroon); font-family: var(--sans); }
      button, [role="button"] { cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .header { background: var(--maroon); color: var(--white); }
      .header-inner { max-width: 32rem; margin: 0 auto; height: 3.5rem; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0 1rem; }
      .brand { font-family: var(--display); font-size: 1.25rem; letter-spacing: 0.16em; color: var(--white); text-decoration: none; }
      .ghost { background: none; border: 0; color: var(--white); font: 500 0.875rem/1 var(--sans); }
      main { max-width: 32rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
      h1 { font-family: var(--display); font-weight: 600; letter-spacing: 0.02em; margin: 0; }
      .hero { padding: 3rem 0 0; }
      .hero h1 { font-size: 3rem; }
      .lede { margin: 0.75rem 0 0; color: var(--muted); line-height: 1.55; }
      .stack { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 2rem; }
      .btn { display: inline-flex; align-items: center; justify-content: center; height: 2.75rem; padding: 0 1rem; border-radius: 8px; font: 500 0.875rem/1 var(--sans); border: 1px solid transparent; text-decoration: none; }
      .btn-primary { background: var(--maroon); color: var(--white); }
      .btn-outline { background: var(--white); color: var(--maroon); border-color: var(--border); }
      .btn-sm { height: 2.5rem; padding: 0 0.75rem; }
      .row-btns { display: flex; gap: 0.5rem; flex-shrink: 0; }
      label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.35rem; }
      input { width: 100%; height: 2.75rem; border: 1px solid var(--border); border-radius: 8px; padding: 0 0.75rem; font: 400 0.875rem/1 var(--sans); color: var(--maroon); background: var(--wash); }
      input:focus { outline: 2px solid var(--maroon); outline-offset: 1px; }
      textarea { width: 100%; min-height: 5.5rem; border: 1px solid var(--border); border-radius: 8px; padding: 0.65rem 0.75rem; font: 400 0.875rem/1.45 var(--sans); color: var(--maroon); background: var(--wash); resize: vertical; }
      textarea:focus { outline: 2px solid var(--maroon); outline-offset: 1px; }
      .check-form { border: 1px solid var(--border); padding: 0.75rem; display: flex; flex-direction: column; gap: 0.75rem; }
      .shot { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
      .note { margin: 0.4rem 0 0; font-size: 0.875rem; line-height: 1.5; width: 100%; }
      .tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--border); }
      .tab { height: 3rem; border: 0; background: none; font: 500 0.875rem/1 var(--sans); color: var(--muted); }
      .tab.active { color: var(--maroon); border-bottom: 2px solid var(--maroon); }
      .hint { text-align: center; font-size: 0.75rem; color: var(--muted); margin: 0.5rem 0 0; }
      .section-title { font-family: var(--display); font-size: 1.125rem; letter-spacing: 0.04em; margin: 2rem 0 0; }
      .week { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0; }
      .list { list-style: none; padding: 0; margin: 0; }
      .item { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; border-bottom: 1px solid var(--border); padding: 0.75rem 0; }
      .item.you { background: var(--wash); padding-left: 0.5rem; padding-right: 0.5rem; }
      .grow { min-width: 0; flex: 1; }
      .name { margin: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .meta { margin: 0.15rem 0 0; font-size: 0.75rem; color: var(--muted); }
      .rank { width: 1.5rem; font-family: var(--display); font-size: 0.875rem; color: var(--muted); }
      .count { font-family: var(--display); font-size: 1.25rem; line-height: 1; }
      .empty { color: var(--muted); font-size: 0.875rem; }
      .linkish { background: none; border: 0; color: var(--muted); font: 400 0.875rem/1 var(--sans); text-decoration: underline; text-underline-offset: 4px; }
      .toast { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); background: var(--white); color: var(--maroon); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.9rem; font-size: 0.875rem; box-shadow: 0 8px 24px rgb(80 0 0 / 0.12); z-index: 50; }
      .user-chip { font-size: 0.875rem; font-weight: 500; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .header-actions { display: flex; align-items: center; gap: 0.75rem; }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="header-inner"><span class="brand">ATR TRACKER</span></div>
      </header>
      <main>
        <h1 style="font-size:1.875rem;margin-top:1.25rem">Create account</h1>
        <p class="lede">Two confirms and it counts this week.</p>
        <form id="auth-form" class="stack" style="margin-top:2rem">
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" autocomplete="name" required minlength="2" />
          </div>
          <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required minlength="4" />
          </div>
          <button class="btn btn-primary" type="submit">Create account</button>
        </form>
      </main>
    </div>
    <script src="app.js?v=9"></script>
  </body>
</html>
